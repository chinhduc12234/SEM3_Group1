name: sem3-group1

x-api-env: &api-env
  ASPNETCORE_ENVIRONMENT: Development
  ASPNETCORE_HTTP_PORTS: 8080
  Jwt__Key: ${JWT_KEY:?Run scripts/init-dev.ps1 first}
  Jwt__Issuer: sem3-identity
  Jwt__Audience: sem3-api

services:
  identity-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: Y
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${SQL_SA_PASSWORD:?Run scripts/init-dev.ps1 first}
    volumes: [identity-data:/var/opt/mssql]
    healthcheck:
      test: [CMD-SHELL, '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" -b -o /dev/null']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
  catalog-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: Y
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${SQL_SA_PASSWORD:?Run scripts/init-dev.ps1 first}
    volumes: [catalog-data:/var/opt/mssql]
    healthcheck:
      test: [CMD-SHELL, '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" -b -o /dev/null']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
  identity-migrate:
    build: { context: ., dockerfile: backend/Dockerfile, args: { SERVICE: IdentityService } }
    image: sem3-identity:dev
    command: [--migrate]
    environment:
      <<: *api-env
      ConnectionStrings__Database: 'Server=identity-db;Database=SEM3_Identity;User Id=sa;Password=${SQL_SA_PASSWORD};Encrypt=True;TrustServerCertificate=True'
      Seed__AdminEmail: ${ADMIN_EMAIL:-admin@sem3.local}
      Seed__AdminPassword: ${ADMIN_PASSWORD:?Run scripts/init-dev.ps1 first}
    depends_on:
      identity-db: { condition: service_healthy }
  catalog-migrate:
    build: { context: ., dockerfile: backend/Dockerfile, args: { SERVICE: CatalogService } }
    image: sem3-catalog:dev
    command: [--migrate]
    environment:
      <<: *api-env
      ConnectionStrings__Database: 'Server=catalog-db;Database=SEM3_Catalog;User Id=sa;Password=${SQL_SA_PASSWORD};Encrypt=True;TrustServerCertificate=True'
      Seed__SampleData: 'true'
    depends_on:
      catalog-db: { condition: service_healthy }
  identity:
    image: sem3-identity:dev
    pull_policy: never
    environment:
      <<: *api-env
      ConnectionStrings__Database: 'Server=identity-db;Database=SEM3_Identity;User Id=sa;Password=${SQL_SA_PASSWORD};Encrypt=True;TrustServerCertificate=True'
    depends_on:
      identity-migrate: { condition: service_completed_successfully }
    restart: unless-stopped
  catalog:
    image: sem3-catalog:dev
    pull_policy: never
    environment:
      <<: *api-env
      Identity__BaseUrl: http://identity:8080
      ConnectionStrings__Database: 'Server=catalog-db;Database=SEM3_Catalog;User Id=sa;Password=${SQL_SA_PASSWORD};Encrypt=True;TrustServerCertificate=True'
    depends_on:
      catalog-migrate: { condition: service_completed_successfully }
    restart: unless-stopped
  web:
    build: { context: ., dockerfile: frontend/Dockerfile }
    restart: unless-stopped
  gateway:
    image: nginx:1.28-alpine
    ports: ['127.0.0.1:${WEB_PORT:-8080}:80']
    volumes: [./infra/gateway.conf:/etc/nginx/conf.d/default.conf:ro]
    depends_on: [identity, catalog, web]
    restart: unless-stopped

volumes:
  identity-data:
  catalog-data:
