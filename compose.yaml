name: give-aid

x-service-environment: &service-environment
  ASPNETCORE_ENVIRONMENT: Development
  ASPNETCORE_HTTP_PORTS: 8080
  Jwt__Issuer: give-aid-identity
  Jwt__Audience: give-aid-api
  Jwt__PublicKeyPath: /run/secrets/jwt_public.pem
  ConnectionStrings__Redis: redis:6379,abortConnect=false

x-backend: &backend
  build:
    context: .
    dockerfile: backend/Dockerfile
  restart: unless-stopped
  depends_on:
    sqlserver:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  # One SQL Server instance keeps the local stack small; each service still owns its own database.
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    ports: ["127.0.0.1:1433:1433"]
    environment:
      ACCEPT_EULA: Y
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${SQL_SA_PASSWORD:?Run scripts/init-dev.ps1 first}
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: [CMD-SHELL, '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" -b -o /dev/null']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # Redis is shared infrastructure; services choose explicitly which read models are cacheable.
  redis:
    image: redis:8-alpine
    command: [redis-server, --appendonly, "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Each API is a separate process and image built from the shared backend Dockerfile.
  sql-provision:
    image: mcr.microsoft.com/mssql/server:2022-latest
    entrypoint: [/bin/bash, -c]
    command:
      - 'exec /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P "$$SQL_SA_PASSWORD" -C -b -i /provision.sql'
    environment:
      SQL_SA_PASSWORD: ${SQL_SA_PASSWORD}
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:?Run scripts/init-dev.ps1 first}
      ORGANIZATION_DB_PASSWORD: ${ORGANIZATION_DB_PASSWORD:?Run scripts/init-dev.ps1 first}
      CAMPAIGN_DB_PASSWORD: ${CAMPAIGN_DB_PASSWORD:?Run scripts/init-dev.ps1 first}
    volumes:
      - ./infra/provision-databases.sql:/provision.sql:ro
    depends_on:
      sqlserver: { condition: service_healthy }

  identity-migrate:
    <<: *backend
    build:
      context: .
      dockerfile: backend/Dockerfile
      args: { SERVICE: IdentityService }
    restart: "no"
    command: [--migrate]
    environment:
      <<: *service-environment
      ConnectionStrings__Database: Server=sqlserver;Database=GiveAid_Identity;User Id=sa;Password=${SQL_SA_PASSWORD};Encrypt=True;TrustServerCertificate=True
      Bootstrap__AdminEmail: ${ADMIN_EMAIL:?Run scripts/init-dev.ps1 first}
      Bootstrap__AdminPassword: ${ADMIN_PASSWORD:?Run scripts/init-dev.ps1 first}
    volumes:
      - ./.secrets/jwt_public.pem:/run/secrets/jwt_public.pem:ro
    depends_on:
      sql-provision: { condition: service_completed_successfully }

  organization-migrate:
    <<: *backend
    build:
      context: .
      dockerfile: backend/Dockerfile
      args: { SERVICE: OrganizationService }
    restart: "no"
    command: [--migrate]
    environment:
      <<: *service-environment
      ConnectionStrings__Database: Server=sqlserver;Database=GiveAid_Organization;User Id=sa;Password=${SQL_SA_PASSWORD};Encrypt=True;TrustServerCertificate=True
    volumes:
      - ./.secrets/jwt_public.pem:/run/secrets/jwt_public.pem:ro
    depends_on:
      sql-provision: { condition: service_completed_successfully }

  identity:
    <<: *backend
    build:
      context: .
      dockerfile: backend/Dockerfile
      args: { SERVICE: IdentityService }
    environment:
      <<: *service-environment
      ConnectionStrings__Database: Server=sqlserver;Database=GiveAid_Identity;User Id=giveaid_identity;Password=${IDENTITY_DB_PASSWORD};Encrypt=True;TrustServerCertificate=True
      Jwt__PrivateKeyPath: /run/secrets/jwt_private.pem
      InternalApi__Key: ${INTERNAL_API_KEY:-}
    volumes:
      - ./.secrets/jwt_public.pem:/run/secrets/jwt_public.pem:ro
      - ./.secrets/jwt_private.pem:/run/secrets/jwt_private.pem:ro
    depends_on:
      identity-migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  organization:
    <<: *backend
    build:
      context: .
      dockerfile: backend/Dockerfile
      args: { SERVICE: OrganizationService }
    environment:
      <<: *service-environment
      ConnectionStrings__Database: Server=sqlserver;Database=GiveAid_Organization;User Id=giveaid_organization;Password=${ORGANIZATION_DB_PASSWORD};Encrypt=True;TrustServerCertificate=True
      Protection__KeyDirectory: /app/keys
      InternalApi__Key: ${INTERNAL_API_KEY:-}
      InternalApi__IdentityUrl: http://identity:8080/
      EmailJS__Enabled: ${EMAILJS_ENABLED:-false}
      EmailJS__ServiceId: ${EMAILJS_SERVICE_ID:-}
      EmailJS__PublicKey: ${EMAILJS_PUBLIC_KEY:-}
      EmailJS__PrivateKey: ${EMAILJS_PRIVATE_KEY:-}
      EmailJS__SubmittedTemplateId: ${EMAILJS_SUBMITTED_TEMPLATE_ID:-}
      EmailJS__ReviewTemplateId: ${EMAILJS_REVIEW_TEMPLATE_ID:-}
      EmailJS__SupportEmail: ${EMAILJS_SUPPORT_EMAIL:-}
      EmailJS__WebsiteUrl: ${EMAILJS_WEBSITE_URL:-http://localhost:8080}
    volumes:
      - ./.secrets/jwt_public.pem:/run/secrets/jwt_public.pem:ro
      - organization-keys:/app/keys
    depends_on:
      organization-migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  campaign-migrate:
    <<: *backend
    build:
      context: .
      dockerfile: backend/Dockerfile
      args: { SERVICE: CampaignService }
    restart: "no"
    command: [--migrate]
    environment:
      <<: *service-environment
      ConnectionStrings__Database: Server=sqlserver;Database=GiveAid_Campaign;User Id=sa;Password=${SQL_SA_PASSWORD};Encrypt=True;TrustServerCertificate=True
    volumes:
      - ./.secrets/jwt_public.pem:/run/secrets/jwt_public.pem:ro
    depends_on:
      sql-provision: { condition: service_completed_successfully }

  campaign:
    <<: *backend
    build:
      context: .
      dockerfile: backend/Dockerfile
      args: { SERVICE: CampaignService }
    environment:
      <<: *service-environment
      ConnectionStrings__Database: Server=sqlserver;Database=GiveAid_Campaign;User Id=giveaid_campaign;Password=${CAMPAIGN_DB_PASSWORD};Encrypt=True;TrustServerCertificate=True
      InternalApi__Key: ${INTERNAL_API_KEY:-}
      InternalApi__OrganizationUrl: http://organization:8080/
      CampaignUploads__Directory: /app/uploads/campaigns
    volumes:
      - ./.secrets/jwt_public.pem:/run/secrets/jwt_public.pem:ro
      - ${CAMPAIGN_UPLOAD_DIR:-./uploads/campaigns}:/app/uploads/campaigns
    depends_on:
      campaign-migrate: { condition: service_completed_successfully }
      organization: { condition: service_started }
      redis: { condition: service_healthy }

  donation:
    <<: *backend
    build:
      context: .
      dockerfile: backend/Dockerfile
      args: { SERVICE: DonationService }
    environment:
      <<: *service-environment
    volumes:
      - ./.secrets/jwt_public.pem:/run/secrets/jwt_public.pem:ro

  volunteer:
    <<: *backend
    build:
      context: .
      dockerfile: backend/Dockerfile
      args: { SERVICE: VolunteerService }
    environment:
      <<: *service-environment
    volumes:
      - ./.secrets/jwt_public.pem:/run/secrets/jwt_public.pem:ro

  content:
    <<: *backend
    build:
      context: .
      dockerfile: backend/Dockerfile
      args: { SERVICE: ContentService }
    environment:
      <<: *service-environment
    volumes:
      - ./.secrets/jwt_public.pem:/run/secrets/jwt_public.pem:ro

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY:-}
    restart: unless-stopped

  gateway:
    image: nginx:1.28-alpine
    ports: ["127.0.0.1:${WEB_PORT:-8080}:80"]
    volumes:
      - ./infra/gateway.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [identity, organization, campaign, donation, volunteer, content, web]
    restart: unless-stopped

volumes:
  organization-keys:
  sqlserver-data:
  redis-data:
