name: give-aid

x-service-environment: &service-environment
  ASPNETCORE_ENVIRONMENT: Development
  ASPNETCORE_HTTP_PORTS: 8080
  Jwt__Issuer: give-aid-identity
  Jwt__Audience: give-aid-api
  Jwt__PublicKeyPath: /run/secrets/jwt_public.pem
  ConnectionStrings__Redis: redis:6379,abortConnect=false

x-backend: &backend
  build:
    context: .
    dockerfile: backend/Dockerfile
  restart: unless-stopped
  depends_on:
    sqlserver:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  # One SQL Server instance keeps the local stack small; each service still owns its own database.
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: Y
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${SQL_SA_PASSWORD:?Run scripts/init-dev.ps1 first}
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: [CMD-SHELL, '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" -b -o /dev/null']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # Redis is shared infrastructure; services choose explicitly which read models are cacheable.
  redis:
    image: redis:8-alpine
    command: [redis-server, --appendonly, "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Each API is a separate process and image built from the shared backend Dockerfile.
  identity:
    <<: *backend
    build:
      context: .
      dockerfile: backend/Dockerfile
      args: { SERVICE: IdentityService }
    environment:
      <<: *service-environment
      ConnectionStrings__Database: Server=sqlserver;Database=GiveAid_Identity;User Id=sa;Password=${SQL_SA_PASSWORD};Encrypt=True;TrustServerCertificate=True
      Jwt__PrivateKeyPath: /run/secrets/jwt_private.pem
    volumes:
      - ./.secrets/jwt_public.pem:/run/secrets/jwt_public.pem:ro
      - ./.secrets/jwt_private.pem:/run/secrets/jwt_private.pem:ro

  organization:
    <<: *backend
    build:
      context: .
      dockerfile: backend/Dockerfile
      args: { SERVICE: OrganizationService }
    environment:
      <<: *service-environment
      ConnectionStrings__Database: Server=sqlserver;Database=GiveAid_Organization;User Id=sa;Password=${SQL_SA_PASSWORD};Encrypt=True;TrustServerCertificate=True
    volumes:
      - ./.secrets/jwt_public.pem:/run/secrets/jwt_public.pem:ro

  campaign:
    <<: *backend
    build:
      context: .
      dockerfile: backend/Dockerfile
      args: { SERVICE: CampaignService }
    environment:
      <<: *service-environment
      ConnectionStrings__Database: Server=sqlserver;Database=GiveAid_Campaign;User Id=sa;Password=${SQL_SA_PASSWORD};Encrypt=True;TrustServerCertificate=True
    volumes:
      - ./.secrets/jwt_public.pem:/run/secrets/jwt_public.pem:ro

  donation:
    <<: *backend
    build:
      context: .
      dockerfile: backend/Dockerfile
      args: { SERVICE: DonationService }
    environment:
      <<: *service-environment
      ConnectionStrings__Database: Server=sqlserver;Database=GiveAid_Donation;User Id=sa;Password=${SQL_SA_PASSWORD};Encrypt=True;TrustServerCertificate=True
    volumes:
      - ./.secrets/jwt_public.pem:/run/secrets/jwt_public.pem:ro

  volunteer:
    <<: *backend
    build:
      context: .
      dockerfile: backend/Dockerfile
      args: { SERVICE: VolunteerService }
    environment:
      <<: *service-environment
      ConnectionStrings__Database: Server=sqlserver;Database=GiveAid_Volunteer;User Id=sa;Password=${SQL_SA_PASSWORD};Encrypt=True;TrustServerCertificate=True
    volumes:
      - ./.secrets/jwt_public.pem:/run/secrets/jwt_public.pem:ro

  content:
    <<: *backend
    build:
      context: .
      dockerfile: backend/Dockerfile
      args: { SERVICE: ContentService }
    environment:
      <<: *service-environment
      ConnectionStrings__Database: Server=sqlserver;Database=GiveAid_Content;User Id=sa;Password=${SQL_SA_PASSWORD};Encrypt=True;TrustServerCertificate=True
    volumes:
      - ./.secrets/jwt_public.pem:/run/secrets/jwt_public.pem:ro

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped

  gateway:
    image: nginx:1.28-alpine
    ports: ["127.0.0.1:${WEB_PORT:-8080}:80"]
    volumes:
      - ./infra/gateway.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [identity, organization, campaign, donation, volunteer, content, web]
    restart: unless-stopped

volumes:
  sqlserver-data:
  redis-data:
