server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 1m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    location /api/auth/ { proxy_pass http://identity:8080; proxy_set_header Host $host; }
    location ~ ^/api/users(?:/|$) { proxy_pass http://identity:8080; proxy_set_header Host $host; }
    location ~ ^/api/products(?:/|$) { proxy_pass http://catalog:8080; proxy_set_header Host $host; }
    location /api/ { return 404; }
    location /internal/ { return 404; }
    location = /health/identity { proxy_pass http://identity:8080/health; }
    location = /health/catalog { proxy_pass http://catalog:8080/health; }
    location / { proxy_pass http://web:80; }
}
