server {
    listen 80;
    server_name _;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /health/identity { proxy_pass http://identity:8080/health/live; }
    location = /health/organization { proxy_pass http://organization:8080/health/live; }
    location = /health/campaign { proxy_pass http://campaign:8080/health/live; }
    location = /health/donation { proxy_pass http://donation:8080/health/live; }
    location = /health/volunteer { proxy_pass http://volunteer:8080/health/live; }
    location = /health/content { proxy_pass http://content:8080/health/live; }

    location ~ ^/api/auth(?:/|$) { proxy_pass http://identity:8080; }
    location ~ ^/api/users(?:/|$) { proxy_pass http://identity:8080; }
    location ~ ^/api/organizations(?:/|$) { proxy_pass http://organization:8080; }
    location ~ ^/api/campaigns(?:/|$) { proxy_pass http://campaign:8080; }
    location ~ ^/api/beneficiaries(?:/|$) { proxy_pass http://campaign:8080; }
    location ~ ^/api/donations(?:/|$) { proxy_pass http://donation:8080; }
    location ~ ^/api/volunteers(?:/|$) { proxy_pass http://volunteer:8080; }
    location ~ ^/api/schedules(?:/|$) { proxy_pass http://volunteer:8080; }
    location ~ ^/api/tasks(?:/|$) { proxy_pass http://volunteer:8080; }
    location ~ ^/api/content(?:/|$) { proxy_pass http://content:8080; }
    location ~ ^/api/queries(?:/|$) { proxy_pass http://content:8080; }
    location ~ ^/api/invitations(?:/|$) { proxy_pass http://content:8080; }
    location /api/ { return 404; }
    location / { proxy_pass http://web:3000; }
}
