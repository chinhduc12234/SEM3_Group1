server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 6m;
    # Docker may assign a new IP when an API is rebuilt; resolve service names at request time.
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $identity http://identity:8080;
    set $organization http://organization:8080;
    set $campaign http://campaign:8080;
    set $donation http://donation:8080;
    set $volunteer http://volunteer:8080;
    set $content http://content:8080;
    set $web http://web:3000;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_set_header Host $host;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /health/identity { proxy_pass $identity/health/live; }
    location = /health/organization { proxy_pass $organization/health/live; }
    location = /health/campaign { proxy_pass $campaign/health/live; }
    location = /health/donation { proxy_pass $donation/health/live; }
    location = /health/volunteer { proxy_pass $volunteer/health/live; }
    location = /health/content { proxy_pass $content/health/live; }

    location ~ ^/api/auth(?:/|$) { proxy_pass $identity; }
    location ~ ^/api/users(?:/|$) { proxy_pass $identity; }
    location ~ ^/api/organizations(?:/|$) { proxy_pass $organization; }
    location ~ ^/api/campaigns(?:/|$) { proxy_pass $campaign; }
    location ~ ^/api/beneficiaries(?:/|$) { proxy_pass $campaign; }
    location ~ ^/api/donations(?:/|$) { proxy_pass $donation; }
    location ~ ^/api/volunteers(?:/|$) { proxy_pass $volunteer; }
    location ~ ^/api/schedules(?:/|$) { proxy_pass $volunteer; }
    location ~ ^/api/tasks(?:/|$) { proxy_pass $volunteer; }
    location ~ ^/api/content(?:/|$) { proxy_pass $content; }
    location ~ ^/api/queries(?:/|$) { proxy_pass $content; }
    location ~ ^/api/invitations(?:/|$) { proxy_pass $content; }
    location /api/ { return 404; }
    location / { proxy_pass $web; }
}
